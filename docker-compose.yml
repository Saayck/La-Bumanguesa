# =====================================================================
# La Bumanguesa — stack completo
#   db      → PostgreSQL 16
#   api     → Spring Boot (Flyway crea el esquema + datos al arrancar)
#   web     → Angular servido por nginx
#
# Uso:  docker compose up -d --build
#   Web:   http://localhost:4200        (panel: /admin; la web llama a la API
#          vía proxy nginx en /api — mismo origen, sin CORS)
#   API:   http://localhost:8081/api    (acceso directo para debug)
# =====================================================================

name: labumanguesa

services:
  db:
    image: postgres:16-alpine
    container_name: labumanguesa-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./api
    container_name: labumanguesa-api
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_DRIVER: ${DB_DRIVER}
      DB_URL: ${DB_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./angular
    container_name: labumanguesa-web
    ports:
      - "4200:8080"
    depends_on:
      - api

volumes:
  postgres-data:
