# Test profile: in-memory H2 (SQL Server compatibility mode) so @SpringBootTest
# can load the context without a running SQL Server. Flyway is disabled and
# Hibernate creates the schema from the entity mappings.
spring.datasource.url=jdbc:h2:mem:labumanguesa_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false
