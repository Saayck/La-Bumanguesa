spring.application.name=api

# ----------------------------------------------------------------------
# Server
# ----------------------------------------------------------------------
server.port=${SERVER_PORT}

# ----------------------------------------------------------------------
# Datasource
# ----------------------------------------------------------------------
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ----------------------------------------------------------------------
# Flyway
# ----------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# ----------------------------------------------------------------------
# CORS
# ----------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS}

# ----------------------------------------------------------------------
# Security / JWT
# ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# ----------------------------------------------------------------------
# IA — modelos open source vía API compatible con OpenAI
#   Por defecto: Ollama self-hosted (gratis, sin API key, sin límites).
#   Alternativas gratuitas sin cambiar código, solo estas variables:
#     Groq       -> AI_BASE_URL=https://api.groq.com/openai/v1  + AI_API_KEY
#     OpenRouter -> AI_BASE_URL=https://openrouter.ai/api/v1    + AI_API_KEY
#   Con AI_ENABLED=false la web oculta el chat y el recomendador.
# ----------------------------------------------------------------------
app.ai.enabled=${AI_ENABLED:true}
app.ai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama3.2:3b}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:90}

# Clasificador semántico anti inyección (capa 1b). Modelo multilingüe open source
# de 278 MB, ~400 ms por consulta. Umbral: más alto = más permisivo.
# 0.50 es el punto medio medido entre ataques (0.61-0.81) y clientes (0.19-0.37).
app.ai.embedding-model=${AI_EMBEDDING_MODEL:paraphrase-multilingual}
app.ai.semantic-guard.enabled=${AI_SEMANTIC_GUARD:true}
app.ai.semantic-guard.threshold=${AI_SEMANTIC_THRESHOLD:0.50}
app.ai.max-tokens=${AI_MAX_TOKENS:700}
# Determinista a propósito. Este asistente recita hechos (precios, horarios) y
# deriva lo que no le toca: la creatividad no aporta y sí resta. Con 0.2 la misma
# pregunta daba respuestas distintas entre ejecuciones, lo que confunde al cliente
# y vuelve poco fiable la suite de evaluación.
app.ai.temperature=${AI_TEMPERATURE:0.0}

# ----------------------------------------------------------------------
# JSON / error handling
# ----------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
