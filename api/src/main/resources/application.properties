spring.application.name=api

# ----------------------------------------------------------------------
# Server (Supports Render/Cloud PORT or local SERVER_PORT)
# ----------------------------------------------------------------------
server.port=${PORT:${SERVER_PORT:8080}}

# ----------------------------------------------------------------------
# Datasource (SQL Server or PostgreSQL/Supabase). Overridable via environment variables.
# ----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:labumanguesa};encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ----------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ----------------------------------------------------------------------
# Flyway (schema migrations live in src/main/resources/db/migration)
# ----------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------------------------
# CORS - allowed origins for the Angular app (comma separated)
# ----------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://*.vercel.app}

# ----------------------------------------------------------------------
# Security / JWT
# ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-super-secreta-de-al-menos-32-bytes-en-produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Bumanguesa2026!}

# ----------------------------------------------------------------------
# JSON / error handling
# ----------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
