spring.application.name=api

# ----------------------------------------------------------------------
# Server
# ----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ----------------------------------------------------------------------
# Datasource (Microsoft SQL Server). Overridable via environment variables.
# The target database must already exist (see DIAGNOSTICO.md).
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:labumanguesa};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ----------------------------------------------------------------------
# JPA / Hibernate
#   ddl-auto=none -> Flyway is the single source of truth for the schema.
#   open-in-view=false -> no lazy loading leaking into the view layer.
#   use_nationalized_character_data -> bind String params as NVARCHAR so
#   unicode content (ñ, é, ★) is stored correctly in SQL Server.
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ----------------------------------------------------------------------
# Flyway (schema migrations live in src/main/resources/db/migration)
# ----------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------------------------
# CORS - allowed origins for the Angular app (comma separated)
# ----------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ----------------------------------------------------------------------
# Security / JWT
#   jwt.secret       -> HS256 signing key (min 32 bytes). OVERRIDE in prod.
#   jwt.expiration   -> token lifetime in milliseconds (default 24h).
#   admin.username   -> seeded admin account (created on first startup).
#   admin.password   -> seeded admin password (stored BCrypt-hashed).
# ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-super-secreta-de-al-menos-32-bytes-en-produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Bumanguesa2026!}

# ----------------------------------------------------------------------
# JSON / error handling
# ----------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
