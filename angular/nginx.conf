server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión exacta de nginx en las respuestas.
    server_tokens off;

    # -----------------------------------------------------------------
    # Cabeceras de seguridad de la PÁGINA.
    #
    # La API ya envía las suyas, pero solo aplican a sus respuestas JSON.
    # El HTML que renderiza el navegador —donde se ejecutaría un XSS— salía
    # sin ninguna. `always` las incluye también en respuestas de error.
    #
    # La CSP está ajustada a lo que la página carga de verdad: tipografías de
    # Google, imágenes remotas de la carta y los mapas/vídeos incrustados.
    # -----------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; media-src 'self' https:; frame-src https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy hacia la API (contenedor `api` en la red de docker compose)
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida cae en index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
