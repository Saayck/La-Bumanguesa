<div class="video-modal-overlay" (click)="closeModal()">
  <div class="video-modal-card" (click)="$event.stopPropagation()">
    <button type="button" class="video-modal-close" (click)="closeModal()" aria-label="Cerrar video">×</button>

    <header class="video-modal-header">
      <span class="video-modal-badge" [style.background]="video.accentColor">
        {{ video.platform | uppercase }}
      </span>
      <h3 class="video-modal-title">{{ video.label }} - La Bumanguesa</h3>
    </header>

    <div class="video-container">
      @if (embedType() === 'iframe') {
        <iframe
          [src]="safeIframeUrl()"
          title="Video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          class="video-player-iframe"
        ></iframe>
      } @else {
        <video
          [src]="videoSourceUrl()"
          controls
          autoplay
          loop
          playsinline
          class="video-player"
        >
          Tu navegador no soporta la reproducción de video.
        </video>
      }
    </div>
  </div>
</div>
