<article class="menu-card" [style.border-bottom-color]="accentBg()">
  <div class="menu-card__media">
    <img
      [src]="item().imageUrl"
      [alt]="item().title"
      loading="lazy"
      decoding="async"
      class="menu-card__image"
    />
    <span
      class="menu-card__badge"
      [style.background]="accentBg()"
      [style.color]="accentText()"
      [style.transform]="'rotate(' + item().badgeRotation + 'deg)'"
    >
      {{ item().badge }}
    </span>
  </div>
  <div class="menu-card__body">
    <h3 class="menu-card__title">{{ item().title }}</h3>
    <p class="menu-card__desc">{{ item().description }}</p>
    <button
      type="button"
      class="menu-card__cta"
      [style.background]="accentBg()"
      [style.color]="accentText()"
      (click)="onOrder($event)"
    >
      {{ item().ctaLabel }}
    </button>
  </div>
</article>
