<section class="facebook-cta">
  <div class="facebook-cta__inner">
    <h2 class="facebook-cta__title">¿Ya eres parte de la mancha?</h2>
    <p class="facebook-cta__desc">
      Síguenos en Facebook para enterarte de promos exclusivas, sorteos y ver
      cómo preparamos tu comida.
    </p>
    <a
      [href]="facebookUrl()"
      target="_blank"
      rel="noopener"
      class="facebook-cta__button"
    >
      <app-brand-icon name="facebook" [size]="26" />
      Seguir en Facebook
    </a>
  </div>
</section>
